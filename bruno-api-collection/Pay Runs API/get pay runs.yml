info:
  name: get pay runs
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:5001/api/pay-runs
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |2
    Lists pay runs, newest period first.

    Roles: admin, hr_payroll_manager, hr_payroll_user

    Optional query params:
      • status      — draft | computed | validated | paid | cancelled
      • start_date  — YYYY-MM-DD, keeps runs ending on or after this date
      • end_date    — YYYY-MM-DD, keeps runs starting on or before this date
        (supply both to filter to runs overlapping that window)

    Each row carries employee_count and total_net, so the list view needs
    no follow-up calls.

    Example: http://localhost:5001/api/pay-runs?status=draft
